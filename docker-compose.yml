services:
  postgres:
    image: postgres:16-alpine
    container_name: expense-tracker-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-expense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-expense}
      POSTGRES_DB: ${POSTGRES_DB:-expense_tracker}
      # ускоряет создание тестовых БД и убирает зависимость от локали хоста
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=C'
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      # без -d healthcheck проходит раньше, чем база реально готова принимать запросы
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-expense} -d ${POSTGRES_DB:-expense_tracker}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
  dbhub:
    image: bytebase/dbhub:latest
    ports:
      - '8080:8080'
    command:
      - --transport
      - http
      - --port
      - '8080'
      - --dsn
      - 'postgres://expense:expense@postgres:5432/expense_tracker?sslmode=disable'
    # без service_healthy dbhub стартует сразу после контейнера postgres и может упасть,
    # пока база ещё не принимает соединения
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
